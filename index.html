        // ============================================================

        const DB_PATHS = {

            operators: 'operators',
            rows: 'rows'
        };

        // ============================================================
        // 全局变量（与之前相同）
        // ============================================================
        let rowsData = [], machineList = [], operatorList = [];
        let defaultSettings = {
            day: { start: '08:00', end: '17:00', rest: 60 },
            night: { start: '20:00', end: '05:00', rest: 30 },
            season: { start: '09:00', end: '18:00', rest: 60 }
        };
        let currentFilter = { type: 'all', value: null };
        let filteredRows = [];
        let isSyncing = false;

        // ============================================================
        // 工具函数（与之前相同）
        // ============================================================
        function getTodayStr() { /* ... */ }
        function parseTimeToMinutes(str) { /* ... */ }
        function calcMinutes(startStr, endStr, restMinutes, repairMinutes) { /* ... */ }
        function sortByPinyin(arr) { /* ... */ }

        // ============================================================
        // 数据读写函数（替换 localStorage 为 Firebase）
        // ============================================================

        // 读取所有数据（首次加载）
        function loadAllFromFirebase() {
            const promises = [
                db.ref(DB_PATHS.settings).once('value'),
                db.ref(DB_PATHS.machines).once('value'),
                db.ref(DB_PATHS.operators).once('value'),
                db.ref(DB_PATHS.rows).once('value')
            ];
            Promise.all(promises).then(results => {
                // 设置
                const settingsSnap = results[0];
                if (settingsSnap.exists()) {
                    defaultSettings = settingsSnap.val();
                    applySettingsToUI();
                }
                // 机台
                const machinesSnap = results[1];
                if (machinesSnap.exists()) {
                    machineList = machinesSnap.val();
                    renderMachineList();
                }
                // 人员
                const operatorsSnap = results[2];
                if (operatorsSnap.exists()) {
                    operatorList = sortByPinyin(operatorsSnap.val());
                    renderOperatorList();
                }
                // 日报
                const rowsSnap = results[3];
                if (rowsSnap.exists()) {
                    rowsData = rowsSnap.val();
                }
                if (!rowsData || !rowsData.length) {
                    // 初始化示例数据
                    rowsData = [
                        { date: '2026-07-24', shift: '白班', machine: '18', product: '8oz', operator: '张三', startTime: '08:00', endTime: '17:00', rest: 60, repair: 0, speed: 110, actual: 50693 },
                        { date: '2026-07-24', shift: '夜班', machine: '18', product: '8oz', operator: '李四', startTime: '20:00', endTime: '05:00', rest: 30, repair: 15, speed: 110, actual: 48000 },
                        { date: '2026-07-25', shift: '寒暑', machine: '22', product: '12白色', operator: '王五', startTime: '09:00', endTime: '18:00', rest: 60, repair: 10, speed: 100, actual: 62014 },
                        { date: '2026-07-25', shift: '临时', machine: '23', product: '7.5', operator: '赵六', startTime: '10:00', endTime: '15:00', rest: 30, repair: 0, speed: 90, actual: 30000 }
                    ];
                    saveRowsToFirebase();
                }
                // 应用查询和渲染
                applyQuery();
                // 开启实时监听
                startRealtimeSync();
            }).catch(err => {
                console.error('加载数据失败', err);
                alert('无法连接数据库，请检查网络或配置。');
            });
        }

        // 保存各个数据到 Firebase
        function saveSettingsToFirebase() { db.ref(DB_PATHS.settings).set(defaultSettings); }
        function saveMachinesToFirebase() { db.ref(DB_PATHS.machines).set(machineList); }
        function saveOperatorsToFirebase() { db.ref(DB_PATHS.operators).set(operatorList); }
        function saveRowsToFirebase() { db.ref(DB_PATHS.rows).set(rowsData); }

        // 统一保存（每次修改后调用）
        function saveAllToFirebase() {
            if (isSyncing) return;
            saveSettingsToFirebase();
            saveMachinesToFirebase();
            saveOperatorsToFirebase();
            saveRowsToFirebase();
        }

        // 实时监听云端变化
        function startRealtimeSync() {
            db.ref(DB_PATHS.rows).on('value', snapshot => {
                if (isSyncing) return;
                const val = snapshot.val();
                if (val && Array.isArray(val)) {
                    isSyncing = true;
                    rowsData = val;
                    applyFilterAndRender();
                    isSyncing = false;
                }
            });
            db.ref(DB_PATHS.machines).on('value', snapshot => {
                if (isSyncing) return;
                const val = snapshot.val();
                if (val && Array.isArray(val)) {
                    isSyncing = true;
                    machineList = val;
                    renderMachineList();
                    renderTable();
                    isSyncing = false;
                }
            });
            db.ref(DB_PATHS.operators).on('value', snapshot => {
                if (isSyncing) return;
                const val = snapshot.val();
                if (val && Array.isArray(val)) {
                    isSyncing = true;
                    operatorList = sortByPinyin(val);
                    renderOperatorList();
                    renderTable();
                    isSyncing = false;
                }
            });
            db.ref(DB_PATHS.settings).on('value', snapshot => {
                if (isSyncing) return;
                const val = snapshot.val();
                if (val) {
                    isSyncing = true;
                    defaultSettings = val;
                    applySettingsToUI();
                    renderTable();
                    isSyncing = false;
                }
            });
        }

        // ============================================================
        // 修改原有保存/加载函数

        // 将原 loadAll 替换为 loadAllFromFirebase
        // 将原 saveAll 替换为 saveAllToFirebase

        function addMachine() {

            saveMachinesToFirebase();

        // ============================================================

        document.getElementById('todayLabel').textContent = getTodayStr();
        loadAllFromFirebase();
    </script>
