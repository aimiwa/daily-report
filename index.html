<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新森元生产日报统计表</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        /* ===== 全局 ===== */
        * { box-sizing: border-box; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
        body { background: #eef2f7; margin: 0; padding: 10px; }
        .container {
            max-width: 1500px; margin: 0 auto; background: #ffffff;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            padding: 16px 16px 24px;
        }
        /* 头部 */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid #1e3a8a; padding-bottom: 10px; margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .header h1 {
            margin: 0; font-size: 20px; color: #0b1e4a;
        }
        .header h1 small {
            font-size: 14px; font-weight: 400; color: #3b5a8a; margin-left: 8px;
            display: block;
        }
        .header-right {
            display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px;
        }
        .btn {
            border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px;
            font-weight: 500; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 4px;
            white-space: nowrap;
        }
        .btn-primary { background: #1e3a8a; color: #fff; }
        .btn-success { background: #0f7b3a; color: #fff; }
        .btn-danger { background: #b91c1c; color: #fff; }
        .btn-outline { background: #fff; color: #1e3a8a; border: 1px solid #1e3a8a; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .file-input-wrap { position: relative; display: inline-block; }
        .file-input-wrap input[type="file"] {
            position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
        }
        .report-date {
            font-size: 14px; color: #3b5a8a; margin: 6px 0 12px;
            border-bottom: 1px solid #dde3ed; padding-bottom: 6px;
        }

        /* 设置面板 - 移动端优化 */
        .settings-panel {
            background: #f8fafd; border: 1px solid #dde3ed; border-radius: 8px;
            padding: 12px 16px; margin-bottom: 12px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
        }
        .settings-group {
            display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
        }
        .settings-group label {
            font-weight: 600; color: #1a2a4a; font-size: 13px; white-space: nowrap;
        }
        .settings-group input[type="time"] {
            padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 4px;
            font-size: 14px; width: 80px; min-width: 70px;
        }
        .settings-group input[type="number"] {
            padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 4px;
            font-size: 14px; width: 60px; min-width: 50px;
        }
        .settings-group span { white-space: nowrap; font-size: 13px; }
        .settings-panel .btn-save {
            background: #1e3a8a; color: #fff; border: none;
            padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .temp-hint, .season-hint {
            font-size: 11px; padding: 0 6px; border-radius: 3px;
            white-space: nowrap;
        }
        .temp-hint { color: #b91c1c; background: #fee2e2; }
        .season-hint { color: #0b642e; background: #d1fae5; }

        /* 机台管理 - 移动优化 */
        .machine-panel {
            background: #f8fafd; border: 1px solid #dde3ed; border-radius: 8px;
            padding: 10px 16px; margin-bottom: 12px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
        }
        .machine-panel .machine-list {
            display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center;
        }
        .machine-panel .machine-item {
            display: inline-flex; align-items: center; gap: 2px;
            background: #e9edf4; padding: 0 6px 0 10px; border-radius: 12px; font-size: 12px;
        }
        .machine-panel .machine-item .del-mac {
            cursor: pointer; color: #b91c1c; font-weight: bold; margin-left: 2px;
        }
        .machine-panel input {
            padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px;
            width: 60px;
        }
        .machine-panel input[type="number"] { width: 50px; }
        .machine-panel .btn-add-mac {
            background: #1e3a8a; color: #fff; border: none;
            padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
        }

        /* 汇总 - 移动用网格 */
        .summary-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 8px; background: #f8fafd; border-radius: 10px;
            padding: 12px 16px; margin-bottom: 16px; border: 1px solid #dde3ed;
        }
        .summary-item .label { font-size: 11px; color: #546a84; }
        .summary-item .value { font-size: 18px; font-weight: 700; color: #0b1e4a; }

        /* 表格 - 移动端横向滚动，隐藏部分列 */
        .table-wrap {
            overflow-x: auto;
            border-radius: 8px; border: 1px solid #dde3ed;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%; border-collapse: collapse; font-size: 12px;
            table-layout: auto; min-width: 700px;
        }
        th {
            background: #e9edf4; color: #1a2a4a; font-weight: 600; padding: 6px 4px;
            border: 1px solid #cbd5e1; text-align: center; white-space: nowrap;
            position: sticky; top: 0; z-index: 2;
        }
        td {
            padding: 4px 2px; border: 1px solid #cbd5e1; text-align: center; vertical-align: middle;
            background: #fff;
        }
        td input, td select {
            width: 100%; padding: 6px 2px; border: 1px solid #cbd5e1; border-radius: 4px;
            font-size: 13px; background: #fff; box-sizing: border-box;
            min-height: 32px;
        }
        td input[readonly] {
            background: #f4f6f9; cursor: not-allowed;
        }
        td select option.temp-option { color: #b91c1c; background: #fee2e2; }
        td select option.season-option { color: #0b642e; background: #d1fae5; }
        .row-del {
            cursor: pointer; color: #b91c1c; font-weight: bold; font-size: 18px;
            background: none; border: none; padding: 0 4px;
        }
        .status-badge {
            display: inline-block; padding: 0 8px; border-radius: 12px;
            font-size: 11px; font-weight: 600;
        }
        .badge-ok { background: #d1fae5; color: #0b642e; }
        .badge-warn { background: #fef3c7; color: #92400e; }
        .badge-fail { background: #fde2e2; color: #991616; }

        /* 移动端隐藏不常用列 */
        @media (max-width: 600px) {
            .hide-mobile { display: none; }
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 18px; }
            .header h1 small { font-size: 12px; }
            .settings-group input[type="time"] { width: 70px; }
            .settings-group input[type="number"] { width: 50px; }
            .machine-panel input { width: 50px; }
            .machine-panel input[type="number"] { width: 45px; }
            table { font-size: 11px; min-width: 600px; }
            td input, td select { font-size: 12px; padding: 4px 2px; min-height: 28px; }
            .btn { font-size: 11px; padding: 4px 8px; }
        }

        .footer-tip {
            margin-top: 12px; font-size: 12px; color: #546a84;
            text-align: right; border-top: 1px solid #e9edf4; padding-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部 -->
    <div class="header">
        <h1>📋 新森元日报 <small>安徽新森元环保科技</small></h1>
        <div class="header-right">
            <button class="btn btn-warning btn-sm" onclick="backupData()">📤 备份</button>
            <div class="file-input-wrap">
                <button class="btn btn-outline btn-sm">📥 恢复</button>
                <input type="file" accept=".json" onchange="restoreData(event)">
            </div>
            <button class="btn btn-outline btn-sm" onclick="downloadTemplate()">📄 模板</button>
            <div class="file-input-wrap">
                <button class="btn btn-outline btn-sm">📂 导入</button>
                <input type="file" accept=".xlsx,.xls" onchange="importExcel(event)">
            </div>
            <button class="btn btn-success btn-sm" onclick="exportExcel()">📥 导出</button>
            <button class="btn btn-primary btn-sm" onclick="addRow()">➕</button>
            <button class="btn btn-danger btn-sm" onclick="clearAll()">🗑️</button>
        </div>
    </div>
    <div class="report-date">
        📅 <span id="todayLabel"></span> ｜ 数据实时保存
    </div>

    <!-- 班次默认设置 -->
    <div class="settings-panel">
        <div class="settings-group">
            <label>🟦白</label>
            <input type="time" id="dayStart" value="08:00">
            <span>～</span>
            <input type="time" id="dayEnd" value="17:00">
            <span>休</span>
            <input type="number" id="dayRest" value="60" step="1" min="0" style="width:50px;"> <span>分</span>
        </div>
        <div class="settings-group">
            <label>🟩夜</label>
            <input type="time" id="nightStart" value="20:00">
            <span>～</span>
            <input type="time" id="nightEnd" value="05:00">
            <span>休</span>
            <input type="number" id="nightRest" value="30" step="1" min="0" style="width:50px;"> <span>分</span>
        </div>
        <div class="settings-group">
            <label>🟧寒暑</label>
            <input type="time" id="seasonStart" value="09:00">
            <span>～</span>
            <input type="time" id="seasonEnd" value="18:00">
            <span>休</span>
            <input type="number" id="seasonRest" value="60" step="1" min="0" style="width:50px;"> <span>分</span>
        </div>
        <button class="btn-save" onclick="saveSettings()">保存</button>
        <span style="font-size:11px; color:#546a84;">
            <span class="season-hint">寒暑</span>
            <span class="temp-hint">临时=手动</span>
        </span>
    </div>

    <!-- 机台管理 -->
    <div class="machine-panel">
        <span style="font-weight:600; font-size:13px;">🛠️</span>
        <div class="machine-list" id="machineList"></div>
        <div style="display:flex; gap:4px; align-items:center;">
            <input type="text" id="newMachine" placeholder="号" style="width:50px;">
            <input type="number" id="newSpeed" placeholder="速" style="width:45px;" step="1" min="0">
            <button class="btn-add-mac" onclick="addMachine()">添加</button>
        </div>
    </div>

    <!-- 汇总 -->
    <div class="summary-grid">
        <div class="summary-item"><span class="label">总实际</span><span class="value" id="sumActual">0</span></div>
        <div class="summary-item"><span class="label">总理论</span><span class="value" id="sumTheory">0</span></div>
        <div class="summary-item"><span class="label">平均效率</span><span class="value" id="avgEff">0%</span></div>
        <div class="summary-item"><span class="label">总差额</span><span class="value" id="sumDiff">0</span></div>
        <div class="summary-item"><span class="label">达标行数</span><span class="value" id="cntPass">0</span></div>
    </div>

    <!-- 表格 -->
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>日期</th>
                    <th>班次</th>
                    <th>机台</th>
                    <th>品名</th>
                    <th>开机</th>
                    <th>关机</th>
                    <th>休息</th>
                    <th class="hide-mobile">维修</th>
                    <th class="hide-mobile">运行</th>
                    <th>速度</th>
                    <th>理论</th>
                    <th>实际</th>
                    <th>效率</th>
                    <th class="hide-mobile">差额</th>
                    <th>状态</th>
                    <th>✕</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div class="footer-tip">
        💡 仅「临时」可修改开机/关机/休息/速度 | 📤 备份/恢复同步数据
    </div>
</div>

<script>
    // ==================== 工具 ====================
    function getTodayStr() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function parseTimeToMinutes(str) {
        if (!str) return null;
        const parts = str.split(':');
        if (parts.length === 2) {
            let h = parseInt(parts[0]), m = parseInt(parts[1]);
            if (!isNaN(h) && !isNaN(m) && h >= 0 && h <= 23 && m >= 0 && m <= 59) return h * 60 + m;
        }
        return null;
    }
    function calcMinutes(startStr, endStr, restMinutes, repairMinutes) {
        const s = parseTimeToMinutes(startStr);
        const e = parseTimeToMinutes(endStr);
        if (s === null || e === null) return 0;
        let diff = e - s;
        if (diff < 0) diff += 1440;
        diff -= (parseInt(restMinutes) || 0);
        diff -= (parseInt(repairMinutes) || 0);
        return Math.max(0, diff);
    }

    // ==================== 设置 ====================
    let defaultSettings = {
        day: { start: '08:00', end: '17:00', rest: 60 },
        night: { start: '20:00', end: '05:00', rest: 30 },
        season: { start: '09:00', end: '18:00', rest: 60 }
    };

    function loadSettings() {
        const saved = localStorage.getItem('shiftDefaults');
        if (saved) {
            try { defaultSettings = JSON.parse(saved); } catch (e) {}
        }
        document.getElementById('dayStart').value = defaultSettings.day.start;
        document.getElementById('dayEnd').value = defaultSettings.day.end;
        document.getElementById('dayRest').value = defaultSettings.day.rest;
        document.getElementById('nightStart').value = defaultSettings.night.start;
        document.getElementById('nightEnd').value = defaultSettings.night.end;
        document.getElementById('nightRest').value = defaultSettings.night.rest;
        document.getElementById('seasonStart').value = defaultSettings.season.start;
        document.getElementById('seasonEnd').value = defaultSettings.season.end;
        document.getElementById('seasonRest').value = defaultSettings.season.rest;
    }

    function saveSettings() {
        defaultSettings.day.start = document.getElementById('dayStart').value || '08:00';
        defaultSettings.day.end = document.getElementById('dayEnd').value || '17:00';
        defaultSettings.day.rest = parseInt(document.getElementById('dayRest').value) || 0;
        defaultSettings.night.start = document.getElementById('nightStart').value || '20:00';
        defaultSettings.night.end = document.getElementById('nightEnd').value || '05:00';
        defaultSettings.night.rest = parseInt(document.getElementById('nightRest').value) || 0;
        defaultSettings.season.start = document.getElementById('seasonStart').value || '09:00';
        defaultSettings.season.end = document.getElementById('seasonEnd').value || '18:00';
        defaultSettings.season.rest = parseInt(document.getElementById('seasonRest').value) || 0;
        localStorage.setItem('shiftDefaults', JSON.stringify(defaultSettings));
        alert('默认时间已保存！');
    }

    function getDefaultTime(shift) {
        const s = shift.trim();
        if (s === '夜班') return defaultSettings.night;
        if (s === '白班') return defaultSettings.day;
        if (s === '寒暑') return defaultSettings.season;
        return null;
    }

    // ==================== 机台 ====================
    let machineList = [];
    function loadMachines() {
        const stored = localStorage.getItem('machineList');
        if (stored) {
            try { machineList = JSON.parse(stored); } catch (e) { machineList = []; }
        }
        if (!machineList.length) {
            machineList = [
                { id: '18', speed: 110 }, { id: '17', speed: 110 },
                { id: '22', speed: 100 }, { id: '27', speed: 100 },
                { id: '1', speed: 110 }, { id: 'A', speed: 45 }, { id: 'B', speed: 45 }
            ];
            saveMachines();
        }
        renderMachineList();
    }
    function saveMachines() { localStorage.setItem('machineList', JSON.stringify(machineList)); }
    function renderMachineList() {
        const container = document.getElementById('machineList');
        container.innerHTML = machineList.map(m =>
            `<span class="machine-item">${m.id} (${m.speed}) <span class="del-mac" onclick="deleteMachine('${m.id}')">✕</span></span>`
        ).join('');
    }
    function addMachine() {
        const id = document.getElementById('newMachine').value.trim();
        const speed = parseFloat(document.getElementById('newSpeed').value);
        if (!id) { alert('请输入机台号'); return; }
        if (isNaN(speed) || speed < 0) { alert('请输入有效速度'); return; }
        if (machineList.some(m => m.id === id)) { alert('已存在'); return; }
        machineList.push({ id, speed });
        saveMachines();
        renderMachineList();
        document.getElementById('newMachine').value = '';
        document.getElementById('newSpeed').value = '';
        renderTable();
    }
    function deleteMachine(id) {
        if (!confirm(`删除机台 ${id} ？`)) return;
        machineList = machineList.filter(m => m.id !== id);
        saveMachines();
        renderMachineList();
        renderTable();
    }
    function getMachineSpeed(id) {
        const found = machineList.find(m => m.id === id);
        return found ? found.speed : null;
    }

    // ==================== 数据 ====================
    let rowsData = [];
    function loadData() {
        const stored = localStorage.getItem('dailyReportData');
        if (stored) {
            try { rowsData = JSON.parse(stored); } catch (e) { rowsData = []; }
        }
        if (!rowsData || !rowsData.length) {
            rowsData = [
                { date: '2026-07-24', shift: '白班', machine: '18', product: '8oz', startTime: '08:00', endTime: '17:00', rest: 60, repair: 0, speed: 110, actual: 50693 },
                { date: '2026-07-24', shift: '夜班', machine: '18', product: '8oz', startTime: '20:00', endTime: '05:00', rest: 30, repair: 15, speed: 110, actual: 48000 },
                { date: '2026-07-25', shift: '寒暑', machine: '22', product: '12白色', startTime: '09:00', endTime: '18:00', rest: 60, repair: 10, speed: 100, actual: 62014 },
                { date: '2026-07-25', shift: '临时', machine: '23', product: '7.5', startTime: '10:00', endTime: '15:00', rest: 30, repair: 0, speed: 90, actual: 30000 }
            ];
        }
        renderTable();
        updateSummary();
        saveData();
    }
    function saveData() { localStorage.setItem('dailyReportData', JSON.stringify(rowsData)); }

    // ==================== 渲染 ====================
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        let html = '';
        rowsData.forEach((row, idx) => {
            const minutes = calcMinutes(row.startTime, row.endTime, row.rest, row.repair);
            const speed = parseFloat(row.speed) || 0;
            const theory = Math.round(minutes * speed);
            const actual = parseFloat(row.actual) || 0;
            const eff = theory ? (actual / theory) : 0;
            const diff = theory - actual;
            let statusText = '', statusClass = '';
            if (theory === 0 && actual === 0) { statusText = '⏸️'; statusClass = 'badge-warn'; }
            else if (eff >= 0.95) { statusText = '✅'; statusClass = 'badge-ok'; }
            else if (eff >= 0.80) { statusText = '⚠️'; statusClass = 'badge-warn'; }
            else { statusText = '❌'; statusClass = 'badge-fail'; }

            const shiftOpts = ['白班', '夜班', '寒暑', '临时'].map(s => {
                const selected = (row.shift === s) ? 'selected' : '';
                let cls = '';
                if (s === '临时') cls = 'class="temp-option"';
                else if (s === '寒暑') cls = 'class="season-option"';
                return `<option value="${s}" ${selected} ${cls}>${s}</option>`;
            }).join('');

            let machineOptsArray = machineList.map(m =>
                `<option value="${m.id}" ${row.machine===m.id?'selected':''}>${m.id}</option>`
            );
            if (!machineList.some(m => m.id === row.machine) && row.machine) {
                machineOptsArray.push(`<option value="${row.machine}" selected>${row.machine}</option>`);
            }
            const machineOptionsStr = machineOptsArray.join('');

            const isReadonly = (row.shift !== '临时') ? 'readonly' : '';
            const tempFlag = (row.shift === '临时') ? ' 🟡' : '';
            const seasonFlag = (row.shift === '寒暑') ? ' 🌱' : '';

            html += `<tr>
                <td><input type="date" value="${row.date||''}" onchange="updateRow(${idx},'date',this.value)"></td>
                <td><select onchange="onShiftChange(${idx}, this.value)">${shiftOpts}</select></td>
                <td>
                    <select onchange="onMachineChange(${idx}, this.value)">
                        <option value="">--</option>
                        ${machineOptionsStr}
                    </select>
                </td>
                <td><input type="text" value="${row.product||''}" onchange="updateRow(${idx},'product',this.value)" placeholder="品名"></td>
                <td><input type="time" value="${row.startTime||''}" onchange="updateRow(${idx},'startTime',this.value)" ${isReadonly}></td>
                <td><input type="time" value="${row.endTime||''}" onchange="updateRow(${idx},'endTime',this.value)" ${isReadonly}></td>
                <td><input type="number" value="${row.rest||0}" onchange="updateRow(${idx},'rest',this.value)" step="1" min="0" style="width:60px;" ${isReadonly}></td>
                <td class="hide-mobile"><input type="number" value="${row.repair||0}" onchange="updateRow(${idx},'repair',this.value)" step="1" min="0" style="width:60px;"></td>
                <td class="hide-mobile"><input type="number" readonly value="${minutes}" style="background:#f4f6f9;width:60px;"></td>
                <td><input type="number" value="${row.speed||''}" onchange="updateRow(${idx},'speed',this.value)" step="1" min="0" style="width:60px;" ${isReadonly}></td>
                <td><input type="number" readonly value="${theory}" style="background:#f4f6f9;width:70px;"></td>
                <td><input type="number" value="${row.actual||''}" onchange="updateRow(${idx},'actual',this.value)" step="1" min="0" style="width:70px;"></td>
                <td>${(eff*100).toFixed(1)}%</td>
                <td class="hide-mobile">${diff}</td>
                <td><span class="status-badge ${statusClass}">${statusText}${seasonFlag}${tempFlag}</span></td>
                <td><button class="row-del" onclick="deleteRow(${idx})">✕</button></td>
            </tr>`;
        });
        tbody.innerHTML = html;
        updateSummary();
        saveData();
    }

    function onShiftChange(idx, newShift) {
        if (idx < 0 || idx >= rowsData.length) return;
        rowsData[idx].shift = newShift;
        if (newShift === '临时') {
            if (!rowsData[idx].startTime) rowsData[idx].startTime = '08:00';
            if (!rowsData[idx].endTime) rowsData[idx].endTime = '17:00';
            if (rowsData[idx].rest === undefined || rowsData[idx].rest === '') rowsData[idx].rest = 0;
            if (rowsData[idx].repair === undefined || rowsData[idx].repair === '') rowsData[idx].repair = 0;
        } else {
            const def = getDefaultTime(newShift);
            if (def) {
                rowsData[idx].startTime = def.start;
                rowsData[idx].endTime = def.end;
                rowsData[idx].rest = def.rest;
                if (rowsData[idx].repair === undefined || rowsData[idx].repair === '') rowsData[idx].repair = 0;
            }
        }
        renderTable();
    }

    function onMachineChange(idx, newMachine) {
        if (idx < 0 || idx >= rowsData.length) return;
        rowsData[idx].machine = newMachine;
        const speed = getMachineSpeed(newMachine);
        if (speed !== null) {
            rowsData[idx].speed = speed;
        }
        renderTable();
    }

    function updateRow(idx, field, value) {
        if (idx < 0 || idx >= rowsData.length) return;
        if (rowsData[idx].shift !== '临时') {
            if (['startTime', 'endTime', 'rest', 'speed'].includes(field)) {
                return;
            }
        }
        if (['speed', 'actual', 'rest', 'repair'].includes(field)) {
            rowsData[idx][field] = parseFloat(value) || 0;
        } else {
            rowsData[idx][field] = value;
        }
        renderTable();
    }

    function deleteRow(idx) {
        if (confirm('确认删除此行？')) {
            rowsData.splice(idx, 1);
            renderTable();
            saveData();
        }
    }

    function addRow() {
        const def = getDefaultTime('白班');
        rowsData.push({
            date: getTodayStr(),
            shift: '白班',
            machine: '',
            product: '',
            startTime: def.start,
            endTime: def.end,
            rest: def.rest,
            repair: 0,
            speed: 100,
            actual: 0
        });
        renderTable();
        saveData();
        const tbody = document.getElementById('tableBody');
        if (tbody) tbody.lastElementChild?.scrollIntoView({ behavior: 'smooth' });
    }

    function clearAll() {
        if (confirm('确定删除全部数据吗？')) {
            rowsData = [];
            renderTable();
            saveData();
        }
    }

    function updateSummary() {
        let sumActual = 0, sumTheory = 0, cntPass = 0;
        rowsData.forEach(row => {
            const minutes = calcMinutes(row.startTime, row.endTime, row.rest, row.repair);
            const theory = Math.round(minutes * (parseFloat(row.speed) || 0));
            const actual = parseFloat(row.actual) || 0;
            sumActual += actual;
            sumTheory += theory;
            if (theory > 0 && (actual / theory) >= 0.95) cntPass++;
        });
        document.getElementById('sumActual').textContent = sumActual.toLocaleString();
        document.getElementById('sumTheory').textContent = sumTheory.toLocaleString();
        const avgEff = sumTheory ? (sumActual / sumTheory) : 0;
        document.getElementById('avgEff').textContent = (avgEff * 100).toFixed(1) + '%';
        document.getElementById('sumDiff').textContent = (sumTheory - sumActual).toLocaleString();
        document.getElementById('cntPass').textContent = cntPass;
    }

    // ==================== 备份/恢复 ====================
    function backupData() {
        const data = {
            version: '1.0',
            backupTime: new Date().toISOString(),
            defaultSettings: defaultSettings,
            machineList: machineList,
            rowsData: rowsData
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `日报备份_${getTodayStr()}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
    }

    function restoreData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (!data.defaultSettings || !data.machineList || !data.rowsData) {
                    alert('无效的备份文件');
                    return;
                }
                if (!confirm('恢复将覆盖当前所有数据，确定？')) return;
                defaultSettings = data.defaultSettings;
                localStorage.setItem('shiftDefaults', JSON.stringify(defaultSettings));
                machineList = data.machineList;
                localStorage.setItem('machineList', JSON.stringify(machineList));
                rowsData = data.rowsData;
                localStorage.setItem('dailyReportData', JSON.stringify(rowsData));
                loadSettings();
                renderMachineList();
                renderTable();
                alert('数据恢复成功！');
            } catch (err) {
                alert('恢复失败：' + err.message);
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // ==================== 导入/导出（全新 XLSX 方式） ====================
    function downloadTemplate() {
        const wb = XLSX.utils.book_new();
        const data = [
            ['日期', '班次', '机台号', '品名', '开机', '关机', '休息', '维修时长', '速度', '实际产量'],
            ['2026-07-25', '白班', '18', '8oz', '08:00', '17:00', 60, 0, 110, 50693],
            ['2026-07-25', '夜班', '18', '8oz', '20:00', '05:00', 30, 15, 110, 48000],
            ['2026-07-25', '寒暑', '22', '12白色', '09:00', '18:00', 60, 10, 100, 62014],
            ['2026-07-25', '临时', '23', '7.5', '10:00', '15:00', 30, 0, 90, 30000]
        ];
        const ws = XLSX.utils.aoa_to_sheet(data);
        ws['!cols'] = [{ wch: 14 }, { wch: 12 }, { wch: 10 }, { wch: 14 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 14 }];
        XLSX.utils.book_append_sheet(wb, ws, '模板');
        const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([wbout], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = '日报导入模板.xlsx';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
    }

    function importExcel(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const data = new Uint8Array(ev.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
                if (!json.length) { alert('文件为空'); return; }

                const headers = Object.keys(json[0]);
                const map = {
                    'date': ['日期', 'date', '日'],
                    'shift': ['班次', 'shift', '班'],
                    'machine': ['机台号', '机台', 'machine', '设备'],
                    'product': ['品名', '产品', 'product', '名称'],
                    'startTime': ['开机', '上班', '开始', 'start'],
                    'endTime': ['关机', '下班', '结束', 'end'],
                    'rest': ['休息', '休息分钟', 'rest'],
                    'repair': ['维修时长', '维修', '修理', 'repair', '停机'],
                    'speed': ['速度', '车速', 'speed', '速率'],
                    'actual': ['实际产量', '产量', '实际', 'actual']
                };
                const colMap = {};
                headers.forEach(h => {
                    const trimmed = h.trim();
                    for (let key in map) {
                        if (map[key].some(k => trimmed.includes(k) || k.includes(trimmed))) {
                            colMap[key] = h;
                            break;
                        }
                    }
                });
                if (!colMap.date || !colMap.machine || !colMap.actual) {
                    alert('导入失败：未找到必需的列（日期、机台号、实际产量）。');
                    return;
                }

                let added = 0;
                json.forEach(row => {
                    let dateVal = row[colMap.date];
                    let dateStr = '';
                    if (typeof dateVal === 'number') {
                        try {
                            const d = new Date((dateVal - 25569) * 86400 * 1000);
                            dateStr = d.toISOString().split('T')[0];
                        } catch (e) { dateStr = getTodayStr(); }
                    } else {
                        dateStr = String(dateVal || '').trim();
                        if (dateStr) {
                            const d = new Date(dateStr);
                            if (!isNaN(d.getTime())) dateStr = d.toISOString().split('T')[0];
                        }
                    }
                    if (!dateStr) dateStr = getTodayStr();

                    let shift = String(row[colMap.shift] || '').trim();
                    if (!['白班', '夜班', '寒暑', '临时'].includes(shift)) shift = '临时';

                    const machine = String(row[colMap.machine] || '').trim();
                    const product = String(row[colMap.product] || '').trim();
                    const formatTime = (val) => {
                        if (typeof val === 'number') {
                            const totalMinutes = Math.round((val - Math.floor(val)) * 1440);
                            const h = Math.floor(totalMinutes / 60);
                            const m = totalMinutes % 60;
                            return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
                        }
                        return String(val || '').trim();
                    };
                    const start = formatTime(row[colMap.startTime]) || '08:00';
                    const end = formatTime(row[colMap.endTime]) || '17:00';
                    const rest = parseFloat(row[colMap.rest]) || 0;
                    const repair = parseFloat(row[colMap.repair]) || 0;
                    const speed = parseFloat(row[colMap.speed]) || 0;
                    const actual = parseFloat(row[colMap.actual]) || 0;

                    rowsData.push({
                        date: dateStr,
                        shift: shift,
                        machine: machine,
                        product: product,
                        startTime: start,
                        endTime: end,
                        rest: rest,
                        repair: repair,
                        speed: speed,
                        actual: actual
                    });
                    added++;
                });
                renderTable();
                saveData();
                alert(`导入成功！共添加 ${added} 行。`);
            } catch (err) {
                alert('导入失败：' + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = '';
    }

    // ==================== 导出（改用 SheetJS 生成标准 XLSX） ====================
    function exportExcel() {
        if (rowsData.length === 0) {
            alert('没有数据可导出');
            return;
        }

        // 构建数据数组（包含表头 + 数据行 + 汇总行）
        const headers = ['日期', '班次', '机台号', '品名', '开机', '关机', '休息', '维修时长', '运行分钟', '速度', '理论产量', '实际产量', '效率', '差额', '状态'];
        const rows = rowsData.map(row => {
            const minutes = calcMinutes(row.startTime, row.endTime, row.rest, row.repair);
            const speed = parseFloat(row.speed) || 0;
            const theory = Math.round(minutes * speed);
            const actual = parseFloat(row.actual) || 0;
            const eff = theory ? (actual / theory * 100) : 0;
            const diff = theory - actual;
            let status = eff >= 95 ? '达标' : (eff >= 80 ? '偏低' : '欠产');
            if (theory === 0 && actual === 0) status = '待产';
            return [
                row.date || '',
                row.shift || '',
                row.machine || '',
                row.product || '',
                row.startTime || '',
                row.endTime || '',
                row.rest || 0,
                row.repair || 0,
                minutes,
                speed,
                theory,
                actual,
                eff.toFixed(1) + '%',
                diff,
                status
            ];
        });

        // 计算汇总
        let sumActual = 0, sumTheory = 0, cntPass = 0;
        rowsData.forEach(row => {
            const minutes = calcMinutes(row.startTime, row.endTime, row.rest, row.repair);
            const theory = Math.round(minutes * (parseFloat(row.speed) || 0));
            const actual = parseFloat(row.actual) || 0;
            sumActual += actual;
            sumTheory += theory;
            if (theory > 0 && (actual / theory) >= 0.95) cntPass++;
        });
        const avgEff = sumTheory ? (sumActual / sumTheory * 100) : 0;
        const totalDiff = sumTheory - sumActual;

        const summaryRow = [
            '📊 合计 / 平均', '', '', '', '', '', '', '',
            '',
            '—',
            sumTheory,
            sumActual,
            avgEff.toFixed(1) + '%',
            totalDiff,
            '达标 ' + cntPass + ' 行'
        ];

        // 合并所有行
        const dataForExport = [headers, ...rows, summaryRow];

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(dataForExport);
        // 设置列宽
        ws['!cols'] = headers.map((_, i) => {
            // 根据列内容适当调整宽度
            const maxLen = dataForExport.reduce((max, row) => {
                const val = row[i] !== undefined ? String(row[i]).length : 0;
                return Math.max(max, val);
            }, 0);
            return { wch: Math.min(Math.max(maxLen + 2, 10), 20) };
        });

        XLSX.utils.book_append_sheet(wb, ws, '日报');
        const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([wbout], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `新森元生产日报_${getTodayStr()}.xlsx`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
    }

    // ==================== 初始化 ====================
    document.getElementById('todayLabel').textContent = getTodayStr();
    loadSettings();
    loadMachines();
    loadData();
</script>
